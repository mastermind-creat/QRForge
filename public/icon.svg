<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060f"/>
      <stop offset="50%" stop-color="#0a1230"/>
      <stop offset="100%" stop-color="#060919"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f6bff"/>
      <stop offset="100%" stop-color="#4da3ff"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b4e"/>
      <stop offset="100%" stop-color="#ff7b89"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Subtle glow orb -->
  <circle cx="360" cy="160" r="120" fill="#2f6bff" opacity="0.18" filter="url(#glow)"/>
  <circle cx="150" cy="380" r="100" fill="#ff3b4e" opacity="0.12" filter="url(#glow)"/>

  <!-- Top-Left Finder Pattern -->
  <rect x="96" y="96" width="112" height="112" rx="20" fill="none" stroke="url(#blueGrad)" stroke-width="18"/>
  <rect x="132" y="132" width="40" height="40" rx="8" fill="url(#blueGrad)"/>

  <!-- Top-Right Finder Pattern -->
  <rect x="304" y="96" width="112" height="112" rx="20" fill="none" stroke="url(#blueGrad)" stroke-width="18"/>
  <rect x="340" y="132" width="40" height="40" rx="8" fill="url(#blueGrad)"/>

  <!-- Bottom-Left Finder Pattern -->
  <rect x="96" y="304" width="112" height="112" rx="20" fill="none" stroke="url(#blueGrad)" stroke-width="18"/>
  <rect x="132" y="340" width="40" height="40" rx="8" fill="url(#blueGrad)"/>

  <!-- QR Matrix Modules / Sparks -->
  <rect x="236" y="104" width="24" height="24" rx="6" fill="#4da3ff"/>
  <rect x="236" y="152" width="24" height="64" rx="6" fill="#2f6bff"/>
  <rect x="104" y="236" width="56" height="24" rx="6" fill="#2f6bff"/>
  <rect x="180" y="236" width="24" height="24" rx="6" fill="#4da3ff"/>

  <!-- Central Forge Anvil / Spark Core -->
  <rect x="232" y="232" width="48" height="48" rx="12" fill="url(#sparkGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="10" fill="#ffffff"/>

  <!-- Bottom-Right Dynamic Matrix Modules -->
  <rect x="304" y="236" width="48" height="24" rx="6" fill="#4da3ff"/>
  <rect x="372" y="236" width="44" height="24" rx="6" fill="#2f6bff"/>
  <rect x="236" y="320" width="24" height="88" rx="6" fill="#2f6bff"/>
  <rect x="284" y="320" width="24" height="24" rx="6" fill="#4da3ff"/>
  <rect x="332" y="284" width="24" height="60" rx="6" fill="#2f6bff"/>
  <rect x="380" y="320" width="36" height="36" rx="8" fill="url(#sparkGrad)"/>
  <rect x="308" y="372" width="60" height="36" rx="8" fill="#4da3ff"/>
  <rect x="388" y="376" width="28" height="32" rx="6" fill="#2f6bff"/>
</svg>
